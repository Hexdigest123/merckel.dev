<!doctype html>

<title>Stillwater — a voice-first companion</title>
<style>

  border: 1px solid rgba(252, 211, 77, 0.4); background: rgba(252, 211, 77, 0.08); color: #fde68a;

}

.modal .actions .btn { flex: 1; }

}

.stat .n { font-size: 24px; font-weight: 700; color: var(--accent-soft); }
.stat .l { font-size: 12px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; }
.section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint); margin: 26px 0 10px; }
.session-card { display: block; width: 100%; text-align: left; color: var(--ink); text-decoration: none; margin-bottom: 10px; cursor: pointer; }
.session-card .row1 { display: flex; align-items: baseline; gap: 10px; }
.session-card .when { font-weight: 600; font-size: 15px; }

.session-card .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: rgba(139, 92, 246, 0.14); border: 1px solid rgba(139, 92, 246, 0.3); color: var(--accent-soft); }
.chip.mood { background: rgba(56, 189, 248, 0.12); border-color: rgba(56, 189, 248, 0.3); color: #7dd3fc; }
.chip.flag { background: rgba(244, 63, 94, 0.12); border-color: rgba(244, 63, 94, 0.35); color: #fda4af; }
.chip.status { background: rgba(148, 163, 184, 0.1); border-color: var(--line); color: var(--ink-dim); }

.transcript { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
.settings-group { margin-bottom: 8px; }
.settings-group .card { display: flex; flex-direction: column; gap: 10px; }
.mem-item { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.mem-item .txt { flex: 1; font-size: 14px; color: var(--ink-dim); line-height: 1.5; }
.mem-item .src { display: block; font-size: 11px; color: var(--ink-faint); margin-top: 3px; }

.iconbtn:hover { color: #fda4af; border-color: rgba(244, 63, 94, 0.4); }
.danger-zone { border-color: rgba(244, 63, 94, 0.35); }
.danger-zone h3 { color: #fda4af; margin: 0 0 6px; font-size: 15px; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--ink-dim); padding: 6px 0; border-bottom: 1px dashed var(--line); }
.kv:last-child { border-bottom: 0; }
.kv b { color: var(--ink); font-weight: 600; }
.muted-note { font-size: 13px; color: var(--ink-faint); line-height: 1.6; }
.start-cta { margin-top: 26px; }
.greeting { font-size: clamp(24px, 5vw, 32px); margin: 18px 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--ink-dim); margin: 0 0 6px; font-size: 15px; }
.center { text-align: center; }
.row { display: flex; gap: 10px; align-items: center; }

@media (max-width: 480px) {
  .stats { grid-template-columns: repeat(3, 1fr); }
  .orb { width: 124px; height: 124px; }

}
@media (prefers-reduced-motion: reduce) {
  .orb-breathe { animation: none; }

}
</style>

<body>
<div id="app" role="main"></div>
<div class="overlay" id="overlay" hidden></div>
<script>
"use strict";
(() => {
const REALTIME_API_BASE = "";
const USERS_KEY = "stillwater:v1:users";
const AUTH_KEY = "stillwater:v1:auth";
const dataKey = (uid) => "stillwater:v1:u:" + uid;
const PBKDF2_ITERATIONS = 600000;

const PERSONA = [
  "You are Stillwater, a calm and warm AI companion for voice conversations.",
  "You are not a licensed therapist, doctor, or clinician, and you never claim to be.",
  "You never diagnose, and you never discuss medication or dosing.",
  "You use reflective listening and open questions, and you keep every turn short because this is a spoken conversation.",
  "If the safety system flags a crisis, slow down, stay with the person, and point them to human crisis support.",
  "You remember what the user has shared in past sessions and may gently reference it."
].join(" ");

const CRISIS_RESOURCES_HTML = `
  <div class="crisis-line">
    <div><div class="t">Call or text 988</div><div class="s">988 Suicide &amp; Crisis Lifeline (US) — free, 24/7</div></div>
    <a class="btn small" href="tel:988">Call 988</a>
  </div>
  <div class="crisis-line">
    <div><div class="t">Text HOME to 741741</div><div class="s">Crisis Text Line — free, 24/7, US &amp; Canada</div></div>
    <a class="btn small ghost" href="sms:741741&body=HOME">Text now</a>
  </div>
  <p class="muted-note">Outside the US? Find your local crisis line at <a href="https://findahelpline.com" target="_blank" rel="noopener noreferrer">findahelpline.com</a>. If anyone is in immediate danger, call your local emergency number now.</p>`;

const SAFETY_PATTERNS = [
  { id: "suicide_ideation", label: "suicidal ideation", re: /(kill myself|killing myself|end my life|ending my life|take my own life|want to die|wanna die|wish i (were|was) dead|better off dead|suicid(e|al)|don'?t want to (be alive|live|exist) (anymore|any more)|no reason to live)/i },
  { id: "self_harm", label: "self-harm", re: /(cut(ting)? myself|hurt(ing)? myself|harm myself|self[- ]?harm|burn myself|slash my wrists|injure myself|overdose|poison myself)/i },
  { id: "harm_others", label: "harm to others", re: /(kill|hurt|harm|stab|shoot|attack|beat) (someone|somebody|him|her|them|my (mom|dad|mother|father|partner|ex)|people)/i },
  { id: "plan_means", label: "plan or means", re: /(ways? to (die|kill myself|end it)|suicide (plan|note|method)|how (do i|to) (kill|hurt) (myself|me)|goodbye (note|letter)|giving away my (things|stuff|possessions)|last time (we|i)|i'?m saying goodbye)/i }
];

const $ = (id) => document.getElementById(id);
const app = $("app");
const overlay = $("overlay");
const enc = new TextEncoder();
const dec = new TextDecoder();

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2));
const b64 = (buf) => {
  const u = new Uint8Array(buf);
  let s = "";
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
};
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const fmtDate = (ts) => new Date(ts).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
const fmtTime = (ts) => new Date(ts).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
const fmtDur = (sec) => {
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return m > 0 ? m + " min" + (s >= 30 ? "+" : "") : s + " sec";
};

async function pbkdf2(password, salt, bytes) {
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" }, base, bytes * 8);
  return new Uint8Array(bits);
}
async function deriveKeys(password, saltB64) {
  const bits = await pbkdf2(password, unb64(saltB64), 64);
  const verifier = b64(bits.slice(0, 32));
  const key = await crypto.subtle.importKey("raw", bits.slice(32), { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
  return { verifier, key };
}
async function encryptText(key, text) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(text));
  return "v1." + b64(iv) + "." + b64(ct);
}
async function decryptText(key, payload) {
  if (!payload) return "";
  if (!payload.startsWith("v1.")) return payload;
  try {
    const parts = payload.split(".");
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(parts[1]) }, key, unb64(parts[2]));
    return dec.decode(pt);
  } catch {
    return "";
  }
}

function loadUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY) || "{}"); } catch { return {}; }
}
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function emptyStore() { return { sessions: [], turns: [], notes: [], events: [], settings: {} }; }

const S = {
  view: "boot",
  user: null,
  key: null,
  store: emptyStore(),
  live: null,
  params: {},
  replyIndex: 0,
  loginAttempts: {}
};

function loadStore() {
  try {
    const raw = localStorage.getItem(dataKey(S.user.id));
    S.store = raw ? Object.assign(emptyStore(), JSON.parse(raw)) : emptyStore();
  } catch {
    S.store = emptyStore();
  }
}
function saveStore() {
  try { localStorage.setItem(dataKey(S.user.id), JSON.stringify(S.store)); } catch { /* quota */ }
}

function ageFromDob(dob) {
  const b = new Date(dob + "T00:00:00");
  if (isNaN(b.getTime())) return -1;
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
  return age;
}

async function signUp(name, email, password, dob) {
  const users = loadUsers();
  const em = email.trim().toLowerCase();
  if (users[em]) return { error: "An account with this email already exists. Try signing in." };
  if (password.length < 8) return { error: "Password must be at least 8 characters." };
  const age = ageFromDob(dob);
  if (age < 0) return { error: "Please enter your date of birth." };
  if (age < 18) {
    return {
      error: "Stillwater is only available to adults (18+). If you're younger and need someone to talk to right now, please reach out: call or text 988 (US) or text HOME to 741741. A trusted adult or school counsellor can also help — you deserve support."
    };
  }
  const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
  const { verifier, key } = await deriveKeys(password, salt);
  const record = { id: uid(), email: em, name: name.trim(), dob, salt, verifier, createdAt: Date.now(), disclosureAcceptedAt: null };
  users[em] = record;
  saveUsers(users);
  await beginSession(record, key);
  return { ok: true };
}

async function signIn(email, password) {
  const em = email.trim().toLowerCase();
  const users = loadUsers();
  const record = users[em];
  const now = Date.now();
  const att = S.loginAttempts[em] || { count: 0, lockedUntil: 0 };
  if (att.lockedUntil > now) return { error: "Too many attempts. Please wait " + Math.ceil((att.lockedUntil - now) / 1000) + "s and try again." };
  if (!record) {
    att.count++; if (att.count >= 5) { att.lockedUntil = now + 30000; att.count = 0; }
    S.loginAttempts[em] = att;
    return { error: "No account found for this email." };
  }
  const { verifier, key } = await deriveKeys(password, record.salt);
  if (verifier !== record.verifier) {
    att.count++; if (att.count >= 5) { att.lockedUntil = now + 30000; att.count = 0; }
    S.loginAttempts[em] = att;
    return { error: "Incorrect password." };
  }
  delete S.loginAttempts[em];
  await beginSession(record, key);
  return { ok: true };
}

async function beginSession(record, key) {
  S.user = { id: record.id, email: record.email, name: record.name };
  S.key = key;
  sessionStorage.setItem(AUTH_KEY, JSON.stringify({ uid: record.id }));
  try {
    const jwk = await crypto.subtle.exportKey("jwk", key);
    sessionStorage.setItem("stillwater:v1:k:" + record.id, JSON.stringify(jwk));
  } catch { /* key not exportable */ }
  loadStore();
  if (!S.store.settings.seeded) await seedDemo();
  if (!record.disclosureAcceptedAt) showDisclosure();
  else go("home");
}

async function restoreAuth() {
  const raw = sessionStorage.getItem(AUTH_KEY);
  if (!raw) { go("welcome"); return; }
  let id;
  try { id = JSON.parse(raw).uid; } catch { go("welcome"); return; }
  const record = Object.values(loadUsers()).find((u) => u.id === id);
  if (!record) { go("welcome"); return; }
  const jwkRaw = sessionStorage.getItem("stillwater:v1:k:" + id);
  if (!jwkRaw) { go("welcome"); return; }
  let key;
  try {
    key = await crypto.subtle.importKey("jwk", JSON.parse(jwkRaw), { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
  } catch { go("welcome"); return; }
  S.user = { id: record.id, email: record.email, name: record.name };
  S.key = key;
  loadStore();
  if (!record.disclosureAcceptedAt) showDisclosure();
  else go("home");
}

async function seedDemo() {
  const now = Date.now();
  const day = 86400000;
  const mk = async (daysAgo, mins, userLines, aiLines, themes, mood) => {
    const startedAt = now - daysAgo * day - 3600000;
    const sid = uid();
    const session = {
      id: sid, startedAt, endedAt: startedAt + mins * 60000,
      durationSec: mins * 60, summaryEnc: await encryptText(S.key, userLines[0] + " " + (userLines[1] || "")),
      themes, mood, status: "completed", safetyFlagged: false, demo: true
    };
    S.store.sessions.push(session);
    let t = startedAt;
    for (let i = 0; i < userLines.length; i++) {
      await addTurn(sid, "user", userLines[i]);
      S.store.turns[S.store.turns.length - 1].startedAtMs = t; t += 45000;
      if (aiLines[i]) { await addTurn(sid, "assistant", aiLines[i]); S.store.turns[S.store.turns.length - 1].startedAtMs = t; t += 30000; }
    }
  };
  await mk(6, 8,
    ["Work has been really stressful this week, my boss keeps adding deadlines.", "I snapped at a coworker and I feel bad about it."],
    ["That sounds like a lot to carry. What's felt hardest about work lately?", "It makes sense that you'd feel bad. What happened right before you snapped?"],
    ["Work", "Stress"], "low");
  await mk(2, 12,
    ["I slept better after talking to my sister about everything.", "I'm worried about the exams next month though."],
    ["I'm glad your sister was there for you. What did talking with her change?", "Exams can feel huge. What's worrying you most about them?"],
    ["Family", "Sleep", "School"], "steady");
  await addNote("Working on: work stress and setting boundaries with my boss", "session-theme");
  await addNote("Has a supportive sister; talking with family helps", "session-summary");
  S.store.settings.seeded = true;
  saveStore();
}

function detectCrisis(text) {
  for (const p of SAFETY_PATTERNS) if (p.re.test(text)) return p;
  return null;
}

const THEME_LEXICON = {
  Work: ["work", "job", "boss", "coworker", "deadline", "office", "career", "meeting", "promotion", "fired", "manager"],
  Family: ["mom", "dad", "mother", "father", "parents", "sister", "brother", "family", "son", "daughter", "grandma", "grandpa"],
  Relationship: ["partner", "girlfriend", "boyfriend", "husband", "wife", "ex", "breakup", "broke up", "dating", "marriage", "divorce", "crush"],
  Friends: ["friend", "friends", "roommate", "lonely", "left out", "hang out"],
  Sleep: ["sleep", "insomnia", "tired", "exhausted", "nightmare", "can't sleep", "woke up"],
  Stress: ["anxiety", "anxious", "stress", "stressed", "worry", "worried", "overwhelmed", "panic", "pressure"],
  Mood: ["depressed", "depression", "sad", "hopeless", "empty", "numb", "down", "crying"],
  Health: ["therapist", "therapy", "doctor", "medication", "meds", "diagnos", "pain", "sick", "illness", "clinic"],
  Money: ["money", "rent", "bills", "debt", "afford", "broke", "paycheck", "expensive"],
  School: ["school", "exam", "exams", "study", "studying", "grades", "university", "college", "homework", "class"],
  Grief: ["died", "death", "funeral", "grief", "passed away", "miss him", "miss her", "miss them", "loss"],
  Body: ["weight", "body", "eating", "appearance", "ugly", "fat", "mirror"]
};
const POS_WORDS = ["good", "great", "happy", "better", "calm", "grateful", "thankful", "loved", "excited", "hopeful", "proud", "relieved", "okay", "fine", "love", "laughed", "win", "progress", "easier", "hope"];
const NEG_WORDS = ["bad", "terrible", "awful", "sad", "angry", "anxious", "scared", "hopeless", "worthless", "tired", "exhausted", "hate", "cry", "cried", "lonely", "overwhelmed", "stressed", "depressed", "numb", "pain", "hurt", "lost", "worst", "shit", "angry", "scared", "alone", "stuck"];

function themesOf(text) {
  const lower = " " + text.toLowerCase() + " ";
  const scored = [];
  for (const [theme, words] of Object.entries(THEME_LEXICON)) {
    let hits = 0;
    for (const w of words) if (lower.includes(w)) hits++;
    if (hits > 0) scored.push([theme, hits]);
  }
  scored.sort((a, b) => b[1] - a[1]);
  return scored.slice(0, 5).map((s) => s[0]);
}
function moodOf(text) {
  const lower = text.toLowerCase();
  let pos = 0, neg = 0;
  for (const w of POS_WORDS) if (lower.includes(w)) pos++;
  for (const w of NEG_WORDS) if (lower.includes(w)) neg++;
  if (neg === 0 && pos > 0) return "lifted";
  if (neg > pos * 1.5) return "heavy";
  if (neg > pos) return "low";
  return "steady";
}

function lastWords(text, n) {
  const words = text.replace(/[^a-z0-9' ]/gi, " ").trim().split(/\s+/).filter(Boolean);
  return words.slice(-n).join(" ").toLowerCase();
}

const REFLECT_TEMPLATES = [
  (s) => `It sounds like ${s} is really weighing on you right now.`,
  (s) => `${s} — that sounds heavy. What's making it feel that way today?`,
  (s) => `I hear you: ${s}. What would help even a little bit right now?`,
  (s) => `That sounds like a lot to carry. Tell me more about ${s}.`,
  (s) => `What's the hardest part of ${s} for you?`,
  (s) => `When you say ${s}, what comes up for you?`
];
const BOUNDARY_REPLY = "I'm an AI companion, not a clinician, so I can't diagnose anything or advise on medication — that's really a conversation for a doctor or licensed therapist. I'm still here to listen though. What's going on?";
const CRISIS_REPLY = "Thank you for telling me that — I'm really glad you said it out loud. You deserve support from a real person right now: please call or text 988, or text HOME to 741741. I'm going to stay right here with you. Can you tell me a little about what's happening?";
const CRISIS_FOLLOWUP = [
  "I'm right here with you. Have you reached out to anyone you trust, or to 988?",
  "You don't have to carry this alone. Would it help to call or text 988 while we talk?",
  "What do you need most in this moment — to be heard, or help finding support?"
];

async function buildMemoryContext() {
  const recent = S.store.sessions.filter((s) => s.status === "completed").sort((a, b) => b.startedAt - a.startedAt).slice(0, 5);
  const parts = [];
  for (const s of recent) {
    const summary = await decryptText(S.key, s.summaryEnc);
    if (summary) parts.push("- " + summary.split(/[.!?]/)[0].slice(0, 140));
  }
  for (const n of S.store.notes.slice(-8)) {
    const c = await decryptText(S.key, n.contentEnc);
    if (c) parts.push("- " + c.slice(0, 140));
  }
  return parts;
}

function generateReply(userText, ctx) {
  if (ctx.crisisActive) {
    const i = S.replyIndex++ % CRISIS_FOLLOWUP.length;
    return CRISIS_FOLLOWUP[i];
  }
  if (/(diagnos|medication|meds|dosage|\bdose\b|prescri|what('| i)s wrong with me|do i have|side effects)/i.test(userText)) return BOUNDARY_REPLY;
  if (ctx.memoryTheme) {
    const lower = userText.toLowerCase();
    const lex = THEME_LEXICON[ctx.memoryTheme] || [];
    if (lex.some((w) => lower.includes(w))) {
      return `Last time we talked, ${ctx.memoryTheme.toLowerCase()} came up for you. Is that still on your mind today?`;
    }
  }
  const slot = lastWords(userText, 4) || "that";
  const t = REFLECT_TEMPLATES[S.replyIndex++ % REFLECT_TEMPLATES.length];
  return t(slot);
}

async function summarizeSession(sessionId) {
  const turns = S.store.turns.filter((t) => t.sessionId === sessionId && t.role === "user");
  const texts = [];
  for (const t of turns) texts.push(await decryptText(S.key, t.textEnc));
  const all = texts.join(" ");
  if (!all.trim()) return { summary: "You took a quiet moment to check in with yourself today.", themes: [], mood: "steady" };
  const sentences = all.split(/(?<=[.!?])\s+/).map((s) => s.trim()).filter((s) => s.length >= 18 && s.length <= 220);
  const scored = sentences.map((s) => {
    const lower = s.toLowerCase();
    let score = Math.min(s.length / 60, 2);
    for (const words of Object.values(THEME_LEXICON)) for (const w of words) if (lower.includes(w)) score += 0.4;
    return [s, score];
  });
  scored.sort((a, b) => b[1] - a[1]);
  const picked = scored.slice(0, 4).map((x) => x[0]);
  const order = sentences.filter((s) => picked.includes(s)).slice(0, 4);
  return {
    summary: (order.length ? order : [sentences[0] || all.slice(0, 200)]).join(" "),
    themes: themesOf(all).slice(0, 5),
    mood: moodOf(all)
  };
}

function setOrbState(state, label) {
  const L = S.live;
  if (L) L.state = state;
  const root = $("session-root");
  if (root) root.dataset.state = state;
  const lab = $("orb-label");
  if (lab) lab.textContent = label || {
    listening: "Listening…", speaking: "Stillwater is speaking…", muted: "Muted", paused: "Paused"
  }[state] || "";
}

function orbLoop() {
  const L = S.live;
  if (!L) return;
  const orb = $("orb");
  if (!orb) return;
  const data = new Uint8Array(L.analyser ? L.analyser.frequencyBinCount : 1);
  const tick = (t) => {
    if (!S.live || S.live.stopping) return;
    let target = 0.12;
    if (S.live.state === "speaking") target = 0.55 + 0.45 * Math.abs(Math.sin(t / 160));
    else if (S.live.state === "listening" && S.live.analyser && !S.live.muted) {
      L.analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      target = 0.12 + (sum / data.length / 255) * 0.95;
    }
    L.level += (target - L.level) * 0.18;
    orb.style.transform = "scale(" + (1 + L.level * 0.16).toFixed(3) + ")";
    orb.style.boxShadow = "0 0 " + Math.round(40 + L.level * 70) + "px " + Math.round(6 + L.level * 18) + "px rgba(139, 92, 246, " + (0.25 + L.level * 0.4).toFixed(3) + ")";
    L.raf = requestAnimationFrame(tick);
  };
  L.raf = requestAnimationFrame(tick);
}

async function startMic() {
  const L = S.live;
  if (!L || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showBanner("This browser can't access the microphone.");
    setOrbState("muted");
    return;
  }
  try {
    L.micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    const AC = window.AudioContext || window.webkitAudioContext;
    L.audioCtx = new AC();
    const src = L.audioCtx.createMediaStreamSource(L.micStream);
    L.analyser = L.audioCtx.createAnalyser();
    L.analyser.fftSize = 256;
    src.connect(L.analyser);
    if (!L.muted) setOrbState("listening");
  } catch {
    setOrbState("muted");
    showBanner("Microphone access was denied. Stillwater can't hear you without it.", true, false);
  }
}

function pauseRecognition() {
  const L = S.live;
  if (L && L.rec) { L.rec.onend = null; try { L.rec.stop(); } catch { /* already stopped */ } }
}

function startRecognition() {
  const L = S.live;
  if (!L || L.stopping) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setOrbState("paused");
    showBanner("This browser doesn't support live speech recognition — try Chrome or Edge. You can still end the session below.");
    return;
  }
  const rec = new SR();
  rec.lang = S.store.settings.lang || "en-US";
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = (ev) => {
    if (!S.live || S.live.stopping) return;
    let finalText = "";
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) finalText += r[0].transcript;
      else interim += r[0].transcript;
    }
    if (finalText.trim()) {
      clearInterim();
      if (S.live.speaking && "speechSynthesis" in window) speechSynthesis.cancel();
      handleUserTurn(finalText.trim());
    } else if (interim.trim()) {
      showInterim(interim.trim());
    }
  };
  rec.onerror = (ev) => {
    if (!S.live || S.live.stopping) return;
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
      setOrbState("muted");
      showBanner("Microphone access was denied. Stillwater can't hear you without it.", true, false);
    } else if (ev.error === "network") {
      connectionLost();
    }
  };
  rec.onend = () => {
    if (S.live && !S.live.stopping && !S.live.paused) { try { rec.start(); } catch { /* restarting */ } }
  };
  L.rec = rec;
  try { rec.start(); } catch { /* already started */ }
}

function resumeListening() {
  const L = S.live;
  if (!L) return;
  hideBanner();
  L.paused = false;
  const sess = S.store.sessions.find((s) => s.id === L.sessionId);
  if (sess && sess.status === "interrupted") { sess.status = "active"; saveStore(); }
  setOrbState(L.muted ? "muted" : "listening");
  startRecognition();
}

function speak(text) {
  return new Promise((resolve) => {
    if (!("speechSynthesis" in window)) { resolve(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    const want = S.store.settings.voice;
    const v = voices.find((x) => x.name === want) || voices.find((x) => x.lang && x.lang.indexOf("en") === 0) || voices[0];
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = S.store.settings.rate || 1;
    u.pitch = 1;
    if (S.live) { S.live.speaking = true; setOrbState("speaking"); }
    let done = false;
    const fin = () => {
      if (done) return;
      done = true;
      if (S.live) {
        S.live.speaking = false;
        if (!S.live.stopping && !S.live.paused) setOrbState(S.live.muted ? "muted" : "listening");
      }
      resolve();
    };
    u.onend = fin;
    u.onerror = fin;
    speechSynthesis.speak(u);
    setTimeout(fin, Math.max(5000, text.length * 140));
  });
}

function addCaption(role, text) {
  const L = S.live;
  if (!L) return;
  L.captions.push({ role, text });
  if (L.captions.length > 40) L.captions.shift();
  renderCaptions();
}
function renderCaptions() {
  const L = S.live;
  const c = $("captions");
  if (!c || !L) return;
  c.innerHTML = L.captions.map((m) => '<div class="cap ' + m.role + '"><span class="who">' + (m.role === "user" ? "You" : "Stillwater") + "</span>" + esc(m.text) + "</div>").join("");
  c.scrollTop = c.scrollHeight;
}
function showInterim(text) {
  const c = $("captions");
  if (!c) return;
  let el = $("cap-interim");
  if (!el) {
    el = document.createElement("div");
    el.className = "cap user interim";
    el.id = "cap-interim";
    c.appendChild(el);
  }
  el.innerHTML = '<span class="who">You</span>' + esc(text);
  c.scrollTop = c.scrollHeight;
}
function clearInterim() {
  const el = $("cap-interim");
  if (el) el.remove();
}

async function handleUserTurn(text) {
  const L = S.live;
  if (!L || L.stopping) return;
  await addTurn(L.sessionId, "user", text);
  addCaption("user", text);
  const hit = detectCrisis(text);
  if (hit && !L.crisisShown) triggerCrisis(hit);
  let reply;
  if (L.crisisJustTriggered) {
    L.crisisJustTriggered = false;
    reply = CRISIS_REPLY;
  } else {
    reply = generateReply(text, { crisisActive: L.crisis, memoryTheme: L.memoryTheme });
  }
  await addTurn(L.sessionId, "assistant", reply);
  addCaption("assistant", reply);
  await speak(reply);
}

function triggerCrisis(hit) {
  const L = S.live;
  if (!L) return;
  L.crisis = true;
  L.crisisJustTriggered = true;
  L.crisisShown = true;
  const sess = S.store.sessions.find((s) => s.id === L.sessionId);
  if (sess) { sess.safetyFlagged = true; saveStore(); }
  addEvent(L.sessionId, hit.id + ":" + hit.label, "crisis_card_shown");
  showCrisisCard();
}

function showCrisisCard() {
  overlay.innerHTML =
    '<div class="modal crisis-card" role="alertdialog" aria-modal="true" aria-labelledby="crisis-h">' +
    '<h2 id="crisis-h">Are you safe right now?</h2>' +
    "<p>What you just said matters, and you deserve support from a real person — not just from me. I'm an AI companion, and I can't keep you safe on my own.</p>" +
    CRISIS_RESOURCES_HTML +
    '<p class="muted-note">This card stays until you acknowledge it. Take all the time you need.</p>' +
    '<div class="actions"><button class="btn" id="crisis-ack">I understand — I\'m still here</button></div>' +
    "</div>";
  overlay.hidden = false;
  $("crisis-ack").addEventListener("click", () => {
    overlay.hidden = true;
    overlay.innerHTML = "";
    if (S.live) {
      addEvent(S.live.sessionId, "crisis_card", "acknowledged");
      if (!S.live.stopping) setOrbState(S.live.muted ? "muted" : "listening");
    }
  });
}

function showBanner(msg, retry, resume) {
  const b = $("banner");
  if (!b) return;
  b.hidden = false;
  let html = esc(msg);
  if (retry) html += '<div class="row"><button class="btn small" id="banner-retry">Allow microphone</button></div>';
  if (resume) html += '<div class="row"><button class="btn small" id="banner-resume">Resume</button><button class="btn small ghost" id="banner-end">End session</button></div>';
  b.innerHTML = html;
  if (retry) $("banner-retry").addEventListener("click", async () => { hideBanner(); await startMic(); startRecognition(); });
  if (resume) {
    $("banner-resume").addEventListener("click", resumeListening);
    $("banner-end").addEventListener("click", () => endSession("completed"));
  }
}
function hideBanner() {
  const b = $("banner");
  if (b) { b.hidden = true; b.innerHTML = ""; }
}

function connectionLost() {
  const L = S.live;
  if (!L || L.stopping) return;
  pauseRecognition();
  L.paused = true;
  setOrbState("paused");
  const sess = S.store.sessions.find((s) => s.id === L.sessionId);
  if (sess && sess.status === "active") { sess.status = "interrupted"; saveStore(); }
  showBanner("Connection lost — this session was saved as interrupted.", false, true);
}

async function startSession() {
  const session = { id: uid(), startedAt: Date.now(), endedAt: null, durationSec: 0, summaryEnc: null, themes: [], mood: null, status: "active", safetyFlagged: false };
  S.store.sessions.push(session);
  saveStore();
  const mem = await buildMemoryContext();
  const recentThemes = S.store.sessions
    .filter((s) => s.status === "completed")
    .sort((a, b) => b.startedAt - a.startedAt)
    .slice(0, 3)
    .flatMap((s) => s.themes || []);
  S.live = {
    sessionId: session.id, captions: [], rec: null, micStream: null, audioCtx: null, analyser: null,
    raf: 0, speaking: false, stopping: false, muted: false, paused: false, crisis: false,
    crisisJustTriggered: false, crisisShown: false, timerId: 0, startedAt: session.startedAt,
    level: 0, state: "listening", memoryTheme: recentThemes[0] || null, memLines: mem
  };
  go("session");
  S.live.timerId = setInterval(() => {
    const el = $("timer");
    if (el && S.live) el.textContent = fmtDur((Date.now() - S.live.startedAt) / 1000);
  }, 1000);
  orbLoop();
  await startMic();
  startRecognition();
  if (!navigator.onLine) showBanner("You're offline — voice may not work until you're back online.");
  const first = S.user.name.split(" ")[0] || "there";
  const greeting = mem.length
    ? "Hi " + first + ". " + mem[0].replace(/^- /, "") + " What's on your mind today?"
    : "Hi " + first + ". I'm Stillwater — an AI companion, here to listen. What's on your mind today?";
  await addTurn(session.id, "assistant", greeting);
  addCaption("assistant", greeting);
  await speak(greeting);
}

async function endSession(reason) {
  const L = S.live;
  if (!L || L.stopping) return;
  L.stopping = true;
  clearInterval(L.timerId);
  pauseRecognition();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (L.micStream) L.micStream.getTracks().forEach((t) => t.stop());
  if (L.audioCtx) { try { await L.audioCtx.close(); } catch { /* closed */ } }
  if (L.raf) cancelAnimationFrame(L.raf);
  const sess = S.store.sessions.find((s) => s.id === L.sessionId);
  if (!sess) { S.live = null; go("home"); return; }
  sess.endedAt = Date.now();
  sess.durationSec = Math.max(1, Math.round((sess.endedAt - L.startedAt) / 1000));
  sess.status = reason === "completed" ? "completed" : "interrupted";
  const sum = await summarizeSession(L.sessionId);
  sess.summaryEnc = await encryptText(S.key, sum.summary);
  sess.themes = sum.themes;
  sess.mood = sum.mood;
  saveStore();
  const themeNotes = S.store.notes.filter((n) => n.source === "session-theme").length;
  for (const th of sum.themes.slice(0, 3)) {
    if (themeNotes < 8) await addNote("Working on: " + th.toLowerCase(), "session-theme");
  }
  if (sum.summary) await addNote("Last session: " + sum.summary.slice(0, 120), "session-summary");
  const id = sess.id;
  S.live = null;
  go("summary", { id });
}

function sessionCard(s) {
  return '<button class="card session-card" data-sid="' + s.id + '">' +
    '<div class="row1"><span class="when">' + esc(fmtDate(s.startedAt)) + ", " + esc(fmtTime(s.startedAt)) + '</span><span class="dur">' + esc(fmtDur(s.durationSec || 0)) + "</span></div>" +
    '<div class="meta">' +
    (s.mood ? '<span class="chip mood">' + esc(s.mood) + "</span>" : "") +
    (s.themes || []).slice(0, 4).map((t) => '<span class="chip">' + esc(t) + "</span>").join("") +
    '<span class="chip status">' + esc(s.status) + "</span>" +
    (s.safetyFlagged ? '<span class="chip flag">safety resources shown</span>' : "") +
    (s.demo ? '<span class="chip status">example</span>' : "") +
    "</div></button>";
}
function bindSessionCards() {
  app.querySelectorAll(".session-card").forEach((el) => el.addEventListener("click", () => go("detail", { id: el.dataset.sid })));
}

function computeStreak() {
  const days = new Set(S.store.sessions.filter((s) => s.status === "completed").map((s) => new Date(s.startedAt).toDateString()));
  let streak = 0;
  const d = new Date();
  if (!days.has(d.toDateString())) d.setDate(d.getDate() - 1);
  while (days.has(d.toDateString())) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}

    '<p class="disclaimer">Stillwater is a supportive AI companion — not a licensed therapist, doctor, or crisis service. If you are in crisis or thinking of harming yourself, call or text <b>988</b> (US) or text <b>HOME to 741741</b> right now.</p>' +
    '<div class="hero-cta">' +
    '<button class="btn" id="go-signup">Create account</button>' +

function renderAuth(mode) {
  const isUp = mode === "signup";
  app.innerHTML =
    '<div class="wrap" style="max-width:440px"><div class="hero" style="padding-top:40px">' +
    '<div class="brand-dot" style="width:22px;height:22px"></div>' +
    "<h1 style='font-size:30px'>" + (isUp ? "Create your account" : "Welcome back") + "</h1>" +
    '<p class="disclaimer">' + (isUp ? "You must be 18 or older to use Stillwater." : "Sign in to continue your conversations.") + "</p></div>" +
    '<form class="card" id="auth-form" novalidate>' +
    (isUp ? '<div class="field"><label for="f-name">Your name</label><input id="f-name" autocomplete="name" required></div>' : "") +
    '<div class="field"><label for="f-email">Email</label><input id="f-email" type="email" autocomplete="email" required></div>' +
    '<div class="field"><label for="f-pass">Password</label><input id="f-pass" type="password" autocomplete="' + (isUp ? "new-password" : "current-password") + '" required minlength="8"></div>' +
    (isUp ? '<div class="field"><label for="f-dob">Date of birth</label><input id="f-dob" type="date" required><span class="hint">Used only to verify you\'re 18 or older. Never shown to anyone.</span></div>' : "") +
    '<div class="error" id="auth-error"></div>' +
    '<button class="btn big" type="submit" id="auth-submit">' + (isUp ? "Create account" : "Sign in") + "</button>" +
    '<p class="hint center mt">' + (isUp ? 'Already have an account? <a href="#" id="switch-auth">Sign in</a>' : 'New here? <a href="#" id="switch-auth">Create an account</a>') + "</p>" +
    "</form></div>";
  $("switch-auth").addEventListener("click", (e) => { e.preventDefault(); go("auth", { mode: isUp ? "signin" : "signup" }); });
  $("auth-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("auth-error");
    err.textContent = "";
    const btn = $("auth-submit");
    btn.disabled = true;
    const email = $("f-email").value;
    const pass = $("f-pass").value;
    let res;
    if (isUp) res = await signUp($("f-name").value, email, pass, $("f-dob").value);
    else res = await signIn(email, pass);
    btn.disabled = false;
    if (res && res.error) err.textContent = res.error;
  });
}

function showDisclosure(reviewOnly) {
  overlay.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="disc-h">' +
    '<h2 id="disc-h">Before we begin</h2>' +
    "<h3>What this is</h3><p>Stillwater is a voice-first <b>AI companion</b>. You talk, it listens and reflects, and it remembers past sessions so the conversation continues over time. In this single-file build it runs entirely in your browser.</p>" +
    "<h3>What this is not</h3><p>Stillwater is <b>not a licensed therapist, doctor, or counsellor</b>. It cannot diagnose, prescribe, or replace professional care. It is not a crisis service.</p>" +
    "<h3>What is stored</h3><ul><li>Your account (email, name, date of birth) on this device.</li><li>Session transcripts and summaries, <b>encrypted with AES-256-GCM</b> using a key derived from your password — stored as ciphertext, never plaintext.</li><li>Safety events (that a crisis card was shown), without transcript content.</li></ul>" +
    "<h3>How to delete it</h3><p>Settings → “Delete my account &amp; data” permanently erases everything — account, sessions, transcripts, memories and events. You can also inspect and delete individual memories at any time.</p>" +
    "<h3>If you're in crisis</h3><p>Call or text <b>988</b> (US Suicide &amp; Crisis Lifeline) or text <b>HOME to 741741</b>. If you're outside the US, see <a href='https://findahelpline.com' target='_blank' rel='noopener noreferrer'>findahelpline.com</a>.</p>" +
    '<div class="actions">' +
    (reviewOnly ? '<button class="btn ghost" id="disc-close">Close</button>' : "") +
    '<button class="btn" id="disc-accept">' + (reviewOnly ? "Got it" : "I understand and accept") + "</button>" +
    "</div></div>";
  overlay.hidden = false;
  const close = () => { overlay.hidden = true; overlay.innerHTML = ""; };
  const c = $("disc-close");
  if (c) c.addEventListener("click", close);
  $("disc-accept").addEventListener("click", () => {
    close();
    if (!reviewOnly) {
      const users = loadUsers();
      const rec = users[S.user.email];
      if (rec) { rec.disclosureAcceptedAt = Date.now(); saveUsers(users); }
      go("home");
    }
  });
}

function renderHome() {
  const done = S.store.sessions.filter((s) => s.status === "completed");
  const mins = Math.round(done.reduce((a, s) => a + (s.durationSec || 0), 0) / 60);
  const recent = [...S.store.sessions].sort((a, b) => b.startedAt - a.startedAt).slice(0, 5);
  const hour = new Date().getHours();
  const hello = hour < 5 ? "Up late" : hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  app.innerHTML = topbar("home") +
    '<div class="wrap">' +
    '<h1 class="greeting">' + esc(hello) + ", " + esc(S.user.name.split(" ")[0]) + ".</h1>" +
    '<p class="sub">Tap below when you\'re ready to talk.</p>' +
    '<div class="stats">' +
    '<div class="card stat"><div class="n">' + done.length + '</div><div class="l">Sessions</div></div>' +
    '<div class="card stat"><div class="n">' + computeStreak() + '</div><div class="l">Day streak</div></div>' +
    '<div class="card stat"><div class="n">' + mins + '</div><div class="l">Minutes</div></div>' +
    "</div>" +
    '<div class="start-cta center"><button class="btn big" id="start-btn" style="max-width:360px">Start a session</button>' +
    '<p class="hint mt">Voice in, voice out. Transcripts are stored encrypted on this device only.</p></div>' +
    '<div class="section-title">Recent sessions</div>' +
    (recent.length ? recent.map(sessionCard).join("") : '<div class="empty">No sessions yet.<br>Your first conversation is one tap away.</div>') +
    "</div>";
  bindTopbar();
  bindSessionCards();
  $("start-btn").addEventListener("click", () => { startSession(); });
}

function renderSession() {
  app.innerHTML =
    '<div class="wrap" id="session-root" data-state="listening" style="max-width:640px">' +
    '<div class="session-head">' +
    '<span class="pill live">Live</span>' +
    (S.live && S.live.crisis ? '<span class="pill danger">Safety resources shown</span>' : "") +
    '<span class="timer" id="timer">0 sec</span>' +
    '<button class="navbtn" id="mute-btn">Mute</button>' +
    "</div>" +
    '<div class="orb-stage"><div class="orb-breathe"><div class="orb" id="orb"></div></div></div>' +
    '<div class="orb-label" id="orb-label">Listening…</div>' +
    '<div class="captions" id="captions" aria-live="polite"></div>' +
    '<div class="banner" id="banner" hidden></div>' +
    '<div class="session-actions"><button class="btn danger end" id="end-btn">End session</button></div>' +
    '<p class="hint center mt">Stillwater is an AI companion, not a licensed clinician. In crisis: call or text 988 (US) · text HOME to 741741.</p>' +
    "</div>";
  $("end-btn").addEventListener("click", () => endSession("completed"));
  $("mute-btn").addEventListener("click", toggleMute);
  renderCaptions();
  if (S.live) setOrbState(S.live.muted ? "muted" : "listening");
}

function toggleMute() {
  const L = S.live;
  if (!L) return;
  L.muted = !L.muted;
  if (L.micStream) L.micStream.getTracks().forEach((t) => { t.enabled = !L.muted; });
  $("mute-btn").textContent = L.muted ? "Unmute" : "Mute";
  setOrbState(L.muted ? "muted" : "listening");
}

  const s = S.store.sessions.find((x) => x.id === id);
  if (!s) { go("home"); return; }
  const summary = await decryptText(S.key, s.summaryEnc);
  app.innerHTML = topbar("home") +
    '<div class="wrap" style="max-width:640px">' +
    '<div class="section-title" style="margin-top:26px">Session summary</div>' +
    '<div class="card">' +
    '<div class="kv"><span>When</span><b>' + esc(fmtDate(s.startedAt)) + ", " + esc(fmtTime(s.startedAt)) + "</b></div>" +
    '<div class="kv"><span>Duration</span><b>' + esc(fmtDur(s.durationSec || 0)) + "</b></div>" +
    '<div class="kv"><span>Status</span><b>' + esc(s.status) + "</b></div>" +
    (s.mood ? '<div class="kv"><span>Mood</span><b><span class="chip mood">' + esc(s.mood) + "</span></b></div>" : "") +
    (s.themes && s.themes.length ? '<div class="kv"><span>Themes</span><b>' + s.themes.map((t) => '<span class="chip">' + esc(t) + "</span>").join(" ") + "</b></div>" : "") +
    "</div>" +
    '<div class="section-title">What you talked about</div>' +
    '<div class="card"><p style="margin:0;line-height:1.7;color:var(--ink)">' + esc(summary || "—") + "</p></div>" +
    (s.safetyFlagged ? '<div class="card mt" style="border-color:rgba(244,63,94,.4)"><p class="muted-note" style="margin:0">A safety resource card was shown during this session. If you\'re still struggling, please call or text <b>988</b> (US) or text <b>HOME to 741741</b>.</p></div>' : "") +
    '<div class="row mt"><button class="btn ghost grow" id="sum-history">History</button><button class="btn grow" id="sum-home">Back home</button></div>' +
    '<p class="hint center mt">Remembered for next time. You can review or delete memories in Settings.</p>' +
    "</div>";

  $("sum-home").addEventListener("click", () => go("home"));

function renderHistory() {
  const all = [...S.store.sessions].sort((a, b) => b.startedAt - a.startedAt);
  app.innerHTML = topbar("history") +
    '<div class="wrap"><div class="section-title" style="margin-top:26px">History</div>' +
    (all.length ? all.map(sessionCard).join("") : '<div class="empty">Nothing here yet.</div>') +
    "</div>";
  bindTopbar();
  bindSessionCards();
}

async function renderDetail(id) {
  const s = S.store.sessions.find((x) => x.id === id);
  if (!s) { go("history"); return; }
  const turns = S.store.turns.filter((t) => t.sessionId === id).sort((a, b) => a.startedAtMs - b.startedAtMs);
  const rows = [];
  for (const t of turns) rows.push({ role: t.role, text: await decryptText(S.key, t.textEnc) });
  const summary = await decryptText(S.key, s.summaryEnc);
  const events = S.store.events.filter((e) => e.sessionId === id);
  app.innerHTML = topbar("history") +
    '<div class="wrap" style="max-width:640px">' +
    '<div class="section-title" style="margin-top:26px"><a href="#" id="back-hist" style="color:var(--ink-faint);text-decoration:none">← History</a></div>' +
    '<div class="card">' +
    '<div class="kv"><span>When</span><b>' + esc(fmtDate(s.startedAt)) + ", " + esc(fmtTime(s.startedAt)) + "</b></div>" +
    '<div class="kv"><span>Duration</span><b>' + esc(fmtDur(s.durationSec || 0)) + "</b></div>" +
    '<div class="kv"><span>Status</span><b>' + esc(s.status) + "</b></div>" +
    (s.mood ? '<div class="kv"><span>Mood</span><b><span class="chip mood">' + esc(s.mood) + "</span></b></div>" : "") +
    (s.themes && s.themes.length ? '<div class="kv"><span>Themes</span><b>' + s.themes.map((t) => '<span class="chip">' + esc(t) + "</span>").join(" ") + "</b></div>" : "") +
    "</div>" +
    (summary ? '<div class="section-title">Summary</div><div class="card"><p style="margin:0;line-height:1.7">' + esc(summary) + "</p></div>" : "") +
    '<div class="section-title">Transcript</div>' +
    (rows.length ? '<div class="transcript">' + rows.map((r) => '<div class="cap ' + r.role + '" style="max-width:100%"><span class="who">' + (r.role === "user" ? "You" : "Stillwater") + "</span>" + esc(r.text) + "</div>").join("") + "</div>" : '<div class="empty">No transcript for this session.</div>') +
    (events.length ? '<div class="section-title">Safety events</div><div class="card">' + events.map((e) => '<div class="kv"><span>' + esc(e.trigger) + "</span><b>" + esc(e.actionTaken) + " · " + esc(fmtTime(e.createdAt)) + "</b></div>").join("") + "</div>" : "") +
    "</div>";
  bindTopbar();
  $("back-hist").addEventListener("click", (e) => { e.preventDefault(); go("history"); });
}

function voiceOptions() {
  if (!("speechSynthesis" in window)) return '<option value="">(browser default)</option>';
  const voices = speechSynthesis.getVoices();
  const cur = S.store.settings.voice || "";
  if (!voices.length) return '<option value="">(browser default — voices load on first use)</option>';
  return voices.map((v) => '<option value="' + esc(v.name) + '"' + (v.name === cur ? " selected" : "") + ">" + esc(v.name) + " (" + esc(v.lang) + ")</option>").join("");
}

async function renderSettings() {
  const notes = [];
  for (const n of [...S.store.notes].sort((a, b) => b.createdAt - a.createdAt)) {
    notes.push({ id: n.id, source: n.source, text: await decryptText(S.key, n.contentEnc) });
  }
  const LANGS = ["en-US", "en-GB", "en-AU", "de-DE", "es-ES", "fr-FR", "it-IT", "pt-BR", "nl-NL", "pl-PL"];
  app.innerHTML = topbar("settings") +
    '<div class="wrap" style="max-width:640px">' +
    '<div class="section-title" style="margin-top:26px">Settings</div>' +
    '<div class="settings-group"><div class="card">' +
    '<div class="field" style="margin-bottom:0"><label for="s-name">Your name</label><input id="s-name" value="' + esc(S.user.name) + '"></div>' +
    '<div class="kv"><span>Email</span><b>' + esc(S.user.email) + "</b></div>" +
    '<div><button class="btn small" id="s-save">Save name</button></div>' +
    "</div></div>" +
    '<div class="section-title">Voice</div>' +
    '<div class="settings-group"><div class="card">' +
    '<div class="field" style="margin-bottom:0"><label for="s-voice">Stillwater\'s voice</label><select id="s-voice">' + voiceOptions() + "</select></div>" +
    '<div class="field" style="margin-bottom:0"><label for="s-rate">Speaking rate: <span id="s-rate-v">' + (S.store.settings.rate || 1) + "</span></label>" +
    '<input id="s-rate" type="range" min="0.7" max="1.3" step="0.05" value="' + (S.store.settings.rate || 1) + '"></div>' +
    '<div class="field" style="margin-bottom:0"><label for="s-lang">Speech recognition language</label><select id="s-lang">' +
    LANGS.map((l) => '<option value="' + l + '"' + (S.store.settings.lang === l ? " selected" : "") + ">" + l + "</option>").join("") +
    "</select></div>" +
    '<div class="row"><button class="btn small" id="s-test">Test voice</button><button class="btn small ghost" id="s-save-voice">Save voice settings</button></div>' +
    "</div></div>" +
    '<div class="section-title">About this app</div>' +
    '<div class="settings-group"><div class="card"><div class="row"><div class="grow muted-note">What Stillwater is, what it stores, how to delete it, and crisis resources.</div><button class="btn small ghost" id="s-disc">Review</button></div></div></div>' +
    '<div class="section-title">What Stillwater remembers about you</div>' +
    '<div class="settings-group"><div class="card">' +
    (notes.length ? notes.map((n) => `<div class="mem-item"><div class="txt">${esc(n.text)}<span class="src">${esc(n.source)}</span></div><button class="iconbtn" data-nid="${n.id}">Delete</button></div>`).join("") : '<p class="muted-note" style="margin:0">Nothing yet. Memories are created from your sessions.</p>') +
    (notes.length ? '<div class="row"><button class="btn small danger" id="s-del-mem">Delete all memories</button></div>' : "") +
    "</div></div>" +
    '<div class="section-title">Danger zone</div>' +
    '<div class="settings-group"><div class="card danger-zone">' +
    "<h3>Delete my account &amp; data</h3>" +
    '<p class="muted-note" style="margin:0 0 10px">Permanently erases your account, all sessions, transcripts, memories and safety events from this device. This cannot be undone.</p>' +
    '<div><button class="btn small danger" id="s-del-account">Delete my account &amp; data</button></div>' +
    "</div></div>" +
    '<p class="hint center mt">Stillwater is an AI companion, not a licensed clinician. In crisis: call or text 988 (US) · text HOME to 741741.</p>' +
    "</div>";
  bindTopbar();
  $("s-save").addEventListener("click", () => {
    const name = $("s-name").value.trim();
    if (!name) return;
    S.user.name = name;
    const users = loadUsers();
    if (users[S.user.email]) { users[S.user.email].name = name; saveUsers(users); }
    go("settings");
  });
  $("s-test").addEventListener("click", () => {
    S.store.settings.voice = $("s-voice").value;
    S.store.settings.rate = parseFloat($("s-rate").value);
    saveStore();
    speak("Hi, I'm Stillwater. This is how I sound.");
  });
  $("s-save-voice").addEventListener("click", () => {
    S.store.settings.voice = $("s-voice").value;
    S.store.settings.rate = parseFloat($("s-rate").value);
    S.store.settings.lang = $("s-lang").value;
    saveStore();
    go("settings");
  });
  $("s-rate").addEventListener("input", () => { $("s-rate-v").textContent = $("s-rate").value; });
  $("s-disc").addEventListener("click", () => showDisclosure(true));
  app.querySelectorAll("[data-nid]").forEach((b) => b.addEventListener("click", () => {
    S.store.notes = S.store.notes.filter((n) => n.id !== b.dataset.nid);
    saveStore();
    go("settings");
  }));
  const dm = $("s-del-mem");
  if (dm) dm.addEventListener("click", () => { S.store.notes = []; saveStore(); go("settings"); });
  $("s-del-account").addEventListener("click", confirmDeleteAccount);
}

function confirmDeleteAccount() {
  overlay.innerHTML =
    '<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="del-h">' +
    '<h2 id="del-h">Delete everything?</h2>' +
    "<p>This permanently deletes your account and <b>all</b> sessions, transcripts, memories and safety events stored on this device. There is no undo.</p>" +
    '<div class="actions"><button class="btn ghost" id="del-cancel">Cancel</button><button class="btn danger" id="del-confirm">Yes, delete everything</button></div>' +
    "</div>";
  overlay.hidden = false;
  $("del-cancel").addEventListener("click", () => { overlay.hidden = true; overlay.innerHTML = ""; });
  $("del-confirm").addEventListener("click", () => {
    const users = loadUsers();
    delete users[S.user.email];
    saveUsers(users);
    localStorage.removeItem(dataKey(S.user.id));
    sessionStorage.clear();
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    S.user = null;
    S.key = null;
    S.store = emptyStore();
    S.live = null;
    overlay.hidden = true;
    overlay.innerHTML = "";
    go("welcome");
  });
}

function signOut() {
  if (S.live && !S.live.stopping) {
    S.live.stopping = true;
    clearInterval(S.live.timerId);
    pauseRecognition();
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    if (S.live.micStream) S.live.micStream.getTracks().forEach((t) => t.stop());
    if (S.live.audioCtx) { try { S.live.audioCtx.close(); } catch { /* closed */ } }
    const sess = S.store.sessions.find((s) => s.id === S.live.sessionId);
    if (sess && sess.status === "active") { sess.status = "interrupted"; sess.endedAt = Date.now(); saveStore(); }
    S.live = null;
  }
  sessionStorage.clear();
  S.user = null;
  S.key = null;
  S.store = emptyStore();
  go("welcome");
}

function go(view, params) {
  S.view = view;
  S.params = params || {};
  render();
  window.scrollTo(0, 0);
}

function render() {
  if (S.view === "session") { renderSession(); return; }
  switch (S.view) {
    case "auth": renderAuth(S.params.mode || "signin"); break;
    case "home": renderHome(); break;
    case "summary": renderSummary(S.params.id); break;
    case "history": renderHistory(); break;
    case "detail": renderDetail(S.params.id); break;
    case "settings": renderSettings(); break;
    default: renderWelcome();
  }
}

window.addEventListener("offline", () => { if (S.live && !S.live.stopping) connectionLost(); });
window.addEventListener("online", () => {
  if (S.live && S.live.paused) showBanner("Back online — you can resume or end the session.", false, true);
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden && S.live && !S.live.stopping && !S.live.paused) {
    pauseRecognition();
    S.live.paused = true;
    setOrbState("paused");
    showBanner("Paused while the page was hidden. Your session is saved — resume or end it below.", false, true);
  }
});
window.addEventListener("beforeunload", () => {
  if (S.live && !S.live.stopping) {
    const s = S.store.sessions.find((x) => x.id === S.live.sessionId);
    if (s && s.status === "active") { s.status = "interrupted"; saveStore(); }
  }
});

restoreAuth();

})();
</script>
